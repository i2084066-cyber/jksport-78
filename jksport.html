<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JK LIVE TV — Watch Live Cricket & TV Channels</title>
  <link id="dynamic-favicon" rel="icon" href="https://cdn-icons-png.flaticon.com/512/2989/2989838.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-main: #070709;
      --bg-card: #121216;
      --bg-card-hover: #1a1a22;
      --bg-pill: #1a1a20;
      --accent: #ff4514;
      --accent-glow: rgba(255, 69, 20, 0.38);
      --accent-border: #c2410c;
      --live-red: #ef4444;
      --text-white: #ffffff;
      --text-muted: #71717a;
      --text-sub: #a1a1aa;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --radius-player: 16px;
      --radius-card: 14px;
      --radius-btn: 11px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 45px;
    }

    /* Top Header (FREEDEKHO Style) */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(7, 7, 9, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 69, 20, 0.28);
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .brand-logo .part-white { color: #ffffff; }
    .brand-logo .part-orange { color: var(--accent); }
    .brand-logo .brand-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
      margin-left: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 6px;
    }

    /* Announcement Banner */
    .top-alert-bar {
      background: linear-gradient(90deg, rgba(255,69,20,0.2), rgba(255,69,20,0.05));
      border-bottom: 1px solid rgba(255,69,20,0.3);
      padding: 9px 16px;
      font-size: 12.5px;
      font-weight: 700;
      color: #fed7aa;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .top-alert-bar.show {
      display: flex;
    }

    .main-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 15px;
    }

    /* Top Channel Bar: [<- Back] [• LIVE] Title */
    .channel-top-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .btn-back {
      background-color: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      color: #d4d4d8;
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge-live-top {
      background-color: rgba(220, 38, 38, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #f87171;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }
    .badge-live-top .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #ef4444;
      animation: blinkDot 1.2s infinite;
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
    }

    .active-channel-heading {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      flex: 1;
      min-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* DUAL-ENGINE PLAYER BOX (Supports Both M3U8 Video & PHP/Iframe Links) */
    .player-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: var(--radius-player);
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
      margin-bottom: 14px;
    }

    .player-box video,
    .player-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #000;
    }
    .player-box video.active-engine,
    .player-box iframe.active-engine {
      display: block;
    }

    .player-box.fit-cover video { object-fit: cover !important; }
    .player-box.fit-fill video { object-fit: fill !important; }
    .player-box.zoom-125 video { transform: scale(1.25); }

    /* Loading Overlay */
    .player-loader {
      position: absolute;
      inset: 0;
      background: rgba(7, 7, 9, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    .player-loader.active { display: flex; }
    .loader-ring {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 69, 20, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Action Row Below Player: [Server 1] [Server 2] [Server 3] --- [Fullscreen] */
    .player-action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .server-buttons-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-server {
      background-color: #141418;
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #a1a1aa;
      padding: 10px 18px;
      border-radius: var(--radius-btn);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-server.active {
      background: linear-gradient(135deg, #ff511a 0%, #e63900 100%);
      border-color: #ff6a3d;
      color: #ffffff;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .right-player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-fullscreen-orange {
      background-color: rgba(255, 69, 20, 0.08);
      border: 1.5px solid var(--accent-border);
      color: var(--accent);
      padding: 10px 16px;
      border-radius: var(--radius-btn);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: 0.2s;
    }
    .btn-fullscreen-orange:hover {
      background-color: var(--accent);
      color: #ffffff;
    }

    /* Section Headings */
    .section-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      margin-top: 8px;
    }
    .section-label {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #a1a1aa;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* FEATURED LIVE MATCH THUMBNAIL BANNERS (e.g., INDIA vs NEW ZEALAND) */
    .featured-banners-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .match-banner-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-card);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: all 0.22s ease;
    }
    .match-banner-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 10px 25px rgba(255, 69, 20, 0.2);
    }
    .match-banner-card.active-card {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(255, 69, 20, 0.35);
    }
    .match-thumb-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    .match-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .match-live-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #dc2626;
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .match-play-icon {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #fff;
    }
    .match-banner-info {
      padding: 11px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .match-banner-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #fff;
    }
    .match-banner-sub {
      font-size: 11px;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
    }

    /* 2-Column Channel Cards Grid (Exact Screenshot Style) */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
      margin-bottom: 24px;
    }

    .channel-item-card {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 11px;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 76px;
    }
    .channel-item-card:hover {
      background-color: var(--bg-card-hover);
    }
    .channel-item-card.active-card {
      border-color: var(--accent);
      background-color: rgba(255, 69, 20, 0.08);
    }

    .channel-logo-box {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background-color: #09090b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      flex-shrink: 0;
    }
    .channel-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .channel-text-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      flex: 1;
    }
    .channel-name {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
      margin-bottom: 4px;
    }
    .channel-cat {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Social Row */
    .social-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }
    .soc-pill {
      flex: 1;
      min-width: 110px;
      padding: 10px 12px;
      border-radius: 10px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: #16161d;
      border: 1px solid var(--border-subtle);
    }

    /* Slide-Out Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 200;
      display: none;
      justify-content: flex-end;
    }
    .drawer-backdrop.open { display: flex; }
    .drawer-panel {
      width: 300px;
      max-width: 85vw;
      background: #0e0e13;
      border-left: 1px solid var(--border-subtle);
      height: 100%;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .drawer-search {
      width: 100%;
      background: #181820;
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 10px 13px;
      border-radius: 9px;
      font-size: 13px;
      outline: none;
    }
    .drawer-cat-btn {
      width: 100%;
      background: #15151c;
      border: 1px solid transparent;
      color: #d4d4d8;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .drawer-cat-btn.active {
      border-color: var(--accent);
      color: #fff;
      background: rgba(255, 69, 20, 0.15);
    }

    #toast-box {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
    }
    .toast-msg {
      background: #18181f;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 9px 16px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <a class="brand-logo" onclick="filterCategory('All')">
      <span id="site-title-white" class="part-white">JK</span><span id="site-title-orange" class="part-orange">LIVETV</span><span class="brand-dot"></span>
    </a>
    <div class="header-actions">
      <button class="menu-btn" onclick="toggleDrawer(true)">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <!-- Live Broadcast Alert Banner from Admin -->
  <div id="top-alert-bar" class="top-alert-bar">
    <i class="fa-solid fa-bullhorn" style="color:var(--accent);"></i>
    <span id="top-alert-text"></span>
  </div>

  <!-- Main Content -->
  <main class="main-wrap">

    <!-- Top Channel Navigation Bar: [<- Back] [• LIVE] Title -->
    <div class="channel-top-bar">
      <button class="btn-back" onclick="document.getElementById('channels-section').scrollIntoView({behavior:'smooth'})">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>
      <div class="badge-live-top">
        <span class="dot"></span>
        <span id="live-pill-text">LIVE</span>
      </div>
      <h1 id="current-channel-title" class="active-channel-heading">INDIA vs NEW ZEALAND — LIVE HD</h1>
    </div>

    <!-- SMART DUAL-ENGINE PLAYER (Plays Both M3U8 & PHP/Embed Links like wasmer.app/play.php) -->
    <div id="player-box" class="player-box">
      <!-- Engine 1: HTML5 HLS Video for .m3u8 links -->
      <video id="hls-video" controls playsinline crossorigin="anonymous"></video>

      <!-- Engine 2: Smart Embed Iframe for play.php / web player links -->
      <iframe id="embed-iframe" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>

      <!-- Loading Spinner -->
      <div id="player-loader" class="player-loader">
        <div class="loader-ring"></div>
        <p id="loader-msg" style="font-size:13px; font-weight:700;">Connecting to Live Server...</p>
      </div>
    </div>

    <!-- Server 1 | Server 2 | Server 3  +  Fullscreen Row -->
    <div class="player-action-row">
      <div class="server-buttons-wrap">
        <button id="srv-btn-1" class="btn-server active" onclick="switchServer(1)">Server 1</button>
        <button id="srv-btn-2" class="btn-server" onclick="switchServer(2)">Server 2</button>
        <button id="srv-btn-3" class="btn-server" onclick="switchServer(3)" style="display:none;">Server 3</button>
      </div>

      <div class="right-player-controls">
        <button id="btn-fit" class="btn-server" style="padding:10px 13px;" onclick="cycleZoomFit()" title="Zoom / Fit">
          <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
        </button>
        <button class="btn-fullscreen-orange" onclick="enterFullscreen()">
          <i class="fa-solid fa-expand"></i> Fullscreen
        </button>
      </div>
    </div>

    <!-- FEATURED LIVE MATCHES / THUMBNAIL BANNERS (Tap thumbnail -> Auto Opens Server & Plays Live) -->
    <div id="featured-section" style="display:none;">
      <div class="section-label-row">
        <span class="section-label"><i class="fa-solid fa-fire" style="color:var(--accent);"></i> LIVE MATCHES & EVENTS (TAP TO WATCH)</span>
      </div>
      <div id="featured-banners-grid" class="featured-banners-grid"></div>
    </div>

    <!-- OTHER CHANNELS (2-Column Grid Like Screenshot) -->
    <div id="channels-section" class="section-label-row">
      <span id="grid-heading" class="section-label">OTHER CHANNELS</span>
      <span id="clear-filter-btn" style="font-size:12px; color:var(--accent); font-weight:700; cursor:pointer; display:none;" onclick="filterCategory('All')">Show All ×</span>
    </div>

    <div id="channels-grid" class="channels-grid"></div>

    <!-- Social Links -->
    <div id="social-row" class="social-row"></div>

  </main>

  <!-- Slide-out Menu Drawer -->
  <div id="menu-drawer" class="drawer-backdrop" onclick="if(event.target===this) toggleDrawer(false)">
    <div class="drawer-panel">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-subtle); padding-bottom:12px;">
        <span style="font-weight:900; font-size:18px;">JK <span style="color:var(--accent);">LIVETV</span></span>
        <button class="menu-btn" onclick="toggleDrawer(false)"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <input type="text" class="drawer-search" placeholder="Search channels or matches..." oninput="onSearchInput(this.value)" />

      <div>
        <p style="font-size:11px; font-weight:800; color:var(--text-muted); margin-bottom:8px;">CATEGORIES</p>
        <button class="drawer-cat-btn active" onclick="filterCategory('All')">All Channels</button>
        <button class="drawer-cat-btn" onclick="filterCategory('LIVE MATCH')">Live Cricket / Matches</button>
        <button class="drawer-cat-btn" onclick="filterCategory('SPORTS')">Sports</button>
        <button class="drawer-cat-btn" onclick="filterCategory('ENTERTAINMENT')">Entertainment</button>
        <button class="drawer-cat-btn" onclick="filterCategory('MOVIES')">Movies</button>
      </div>

      <div style="margin-top:auto; border-top:1px solid var(--border-subtle); padding-top:12px; display:flex; justify-content:space-between; align-items:center;">
        <span id="sync-status-label" style="font-size:11px; color:#10b981;">● Cloud Connected (asia-southeast1)</span>
        <a href="admin.html" style="font-size:12px; color:var(--accent); font-weight:800; text-decoration:none;">
          <i class="fa-solid fa-lock"></i> Admin Panel
        </a>
      </div>
    </div>
  </div>

  <div id="toast-box"></div>

  <!-- HLS.js + Firebase Realtime Database ONLY (No Firestore Error!) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-database-compat.js"></script>

  <script>
    /********************************************************************
     * AAPKA EXACT FIREBASE CONFIG (asia-southeast1 Region)
     ********************************************************************/
