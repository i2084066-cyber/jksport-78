<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title>
<style>
:root{--bg:#0c0a09;--card:#161312;--line:#2a2523;--tx:#f5f1ee;--mut:#948b86;--ac:#ff5a1f}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:50px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-top:3px solid var(--ac);border-bottom:1px solid var(--line)}
.logo{font-size:22px;font-weight:900;letter-spacing:-1px}.logo b{color:var(--ac)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.login{max-width:380px;margin:12vh auto}
h2{font-size:19px;margin-bottom:14px}
label{display:block;color:var(--mut);font-size:13px;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;background:#0f0d0c;color:var(--tx);border:1px solid var(--line);border-radius:10px;font:inherit}
textarea{min-height:84px;font-family:ui-monospace,monospace;font-size:13px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.pri{background:linear-gradient(135deg,#ff6a2b,#ff4a10);color:#fff;padding:13px 22px;border-radius:12px;font-weight:700;margin-top:16px}
.ghost{padding:10px 16px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:11px 20px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row div{flex:1;min-width:0}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mut)}
.del{color:#ff6b6b}
.msg{margin-top:12px;font-size:14px;color:#ffb08f;min-height:18px}
.eb{background:#3a0f0f;border:1px solid #6b1c1c;color:#ffb0b0;padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:14px}
.th{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#241e1c;flex:none}
.pv{max-height:150px;max-width:100%;border-radius:12px;margin-top:10px;border:1px solid var(--line);display:block}
.up{border:1px dashed var(--ac);border-radius:12px;padding:16px;text-align:center;color:var(--mut);cursor:pointer;display:block;margin:6px 0 0}
.up input{display:none}
.hint{color:var(--mut);font-size:12px;margin-top:6px}
