<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Sports</title>
<style>
:root{--bg:#0c0a09;--card:#161312;--line:#2a2523;--tx:#f5f1ee;--mut:#948b86;--ac:#ff5a1f}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-top:3px solid var(--ac);border-bottom:1px solid var(--line)}
.logo{font-size:26px;font-weight:900;letter-spacing:-1.2px}
.logo b{color:var(--ac)}
.mb{font-size:30px;line-height:1;padding:4px 8px}
.sm{position:absolute;right:14px;top:62px;z-index:9;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;min-width:190px;box-shadow:0 14px 40px #000a}
.sm a{display:block;padding:12px 14px;color:var(--tx);text-decoration:none;border-radius:10px}
.sm a:hover{background:#ffffff10}
.notice{background:#ff5a1f1f;color:#ffb08f;padding:10px 18px;font-size:14px;border-bottom:1px solid var(--line)}
main{max-width:980px;margin:0 auto;padding:16px 16px 0}
.ad{margin:12px 0;text-align:center;overflow:hidden}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.live{background:#3a0f0f;color:#ff4d4d;border:1px solid #6b1c1c;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:700;letter-spacing:.5px}
.bar h2{font-size:21px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage{aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.stage video,.stage iframe{width:100%;height:100%;border:0;background:#000}
.empty{height:100%;display:grid;place-items:center;color:var(--mut)}
.ctl{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.sv{padding:13px 24px;border-radius:12px;background:var(--card);color:var(--mut);border:1px solid var(--line);font-size:17px}
.sv.on{background:linear-gradient(135deg,#ff6a2b,#ff4a10);color:#fff;border-color:transparent;box-shadow:0 8px 24px #ff5a1f55}
.fs{margin-left:auto;padding:13px 22px;border-radius:12px;border:1px solid var(--ac);color:var(--ac);font-size:17px;font-weight:600}
h3{margin:26px 0 12px;color:var(--mut);font-size:19px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{padding:8px 16px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap;font-size:14px}
.chip.on{background:var(--tx);color:#111;border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;align-items:center;gap:14px;text-align:left;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.card.on{border-color:var(--ac);background:#1d1410}
.lg{width:56px;height:56px;flex:none;border-radius:12px;background:#241e1c;display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--ac);overflow:hidden}
