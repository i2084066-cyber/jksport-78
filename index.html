<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>JK LIVE TV — Watch Live Cricket & TV Channels</title>
  <link id="dynamic-favicon" rel="icon" href="https://cdn-icons-png.flaticon.com/512/2989/2989838.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-main: #070709;
      --bg-card: #121216;
      --bg-card-hover: #1a1a22;
      --bg-pill: #1a1a20;
      --accent: #ff4514;
      --accent-glow: rgba(255, 69, 20, 0.38);
      --accent-border: #c2410c;
      --live-red: #ef4444;
      --text-white: #ffffff;
      --text-muted: #71717a;
      --text-sub: #a1a1aa;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --radius-player: 16px;
      --radius-card: 14px;
      --radius-btn: 11px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 45px;
    }

    /* Top Header (FREEDEKHO Style) */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(7, 7, 9, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 69, 20, 0.28);
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .brand-logo .part-white { color: #ffffff; }
    .brand-logo .part-orange { color: var(--accent); }
    .brand-logo .brand-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
      margin-left: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 6px;
    }

    /* Announcement Banner */
    .top-alert-bar {
      background: linear-gradient(90deg, rgba(255,69,20,0.2), rgba(255,69,20,0.05));
      border-bottom: 1px solid rgba(255,69,20,0.3);
      padding: 9px 16px;
      font-size: 12.5px;
      font-weight: 700;
      color: #fed7aa;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .top-alert-bar.show {
      display: flex;
    }

    .main-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 15px;
    }

    /* Top Channel Bar: [<- Back] [• LIVE] Title */
    .channel-top-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .btn-back {
      background-color: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      color: #d4d4d8;
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge-live-top {
      background-color: rgba(220, 38, 38, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #f87171;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }
    .badge-live-top .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #ef4444;
      animation: blinkDot 1.2s infinite;
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
    }

    .active-channel-heading {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      flex: 1;
      min-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==============================================================
     * IN-APP UNIVERSAL PLAYER + FULL ROTATE LANDSCAPE MODE
     * ============================================================== */
    .player-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: var(--radius-player);
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
      margin-bottom: 14px;
      transition: all 0.25s ease;
    }

    /* Fullscreen normal mode */
    .player-box.in-app-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      aspect-ratio: auto !important;
      border-radius: 0 !important;
      border: none !important;
      z-index: 99999 !important;
      margin: 0 !important;
      background: #000 !important;
    }

    /* Forced 90-Degree Landscape Rotate Mode (Works on ANY phone even if rotation is locked!) */
    .player-box.forced-landscape-rotate {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      width: 100vh !important;
      height: 100vw !important;
      transform: translate(-50%, -50%) rotate(90deg) !important;
      aspect-ratio: auto !important;
      border-radius: 0 !important;
      border: none !important;
      z-index: 99999 !important;
      margin: 0 !important;
      background: #000 !important;
    }

    .player-box video,
    .player-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #000;
    }
    .player-box video.active-engine,
    .player-box iframe.active-engine {
      display: block;
    }

    /* Video Fit & Zoom Modes */
    .player-box.fit-cover video { object-fit: cover !important; }
    .player-box.fit-fill video { object-fit: fill !important; }
    .player-box.zoom-125 video { transform: scale(1.25); }

    /* Floating Controls Inside Fullscreen / Rotate Mode */
    .fs-floating-controls {
      position: absolute;
      top: 14px;
      right: 16px;
      z-index: 100000;
      display: none;
      gap: 8px;
    }
    .player-box.in-app-fullscreen .fs-floating-controls,
    .player-box.forced-landscape-rotate .fs-floating-controls {
      display: flex;
    }
    .fs-ctrl-pill {
      background: rgba(15, 15, 20, 0.85);
      border: 1.5px solid var(--accent);
      color: #fff;
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    /* Live Status Badge inside Player Corner (Hides Raw URL) */
    .in-player-live-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(220, 38, 38, 0.9);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 800;
      z-index: 22;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.5px;
    }

    /* Tap to Unmute Floating Button */
    .unmute-pill {
      position: absolute;
      bottom: 58px;
      left: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 15px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      z-index: 30;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    }
    .unmute-pill.show { display: inline-flex; }

    /* Loading Overlay */
    .player-loader {
      position: absolute;
      inset: 0;
      background: rgba(7, 7, 9, 0.82);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }
    .player-loader.active { display: flex; }
    .loader-ring {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 69, 20, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Action Row Below Player: [Server 1] [Server 2] --- [Rotate] [Fullscreen] */
    .player-action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .server-buttons-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-server {
      background-color: #141418;
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #a1a1aa;
      padding: 10px 16px;
      border-radius: var(--radius-btn);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-server.active {
      background: linear-gradient(135deg, #ff511a 0%, #e63900 100%);
      border-color: #ff6a3d;
      color: #ffffff;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .right-player-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .btn-fullscreen-orange {
      background-color: rgba(255, 69, 20, 0.1);
      border: 1.5px solid var(--accent-border);
      color: var(--accent);
      padding: 10px 14px;
      border-radius: var(--radius-btn);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-fullscreen-orange:hover {
      background-color: var(--accent);
      color: #ffffff;
    }

    /* Section Headings */
    .section-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      margin-top: 8px;
    }
    .section-label {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #a1a1aa;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* FEATURED LIVE MATCH THUMBNAIL BANNERS */
    .featured-banners-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .match-banner-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-card);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: all 0.22s ease;
    }
    .match-banner-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 10px 25px rgba(255, 69, 20, 0.2);
    }
    .match-banner-card.active-card {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(255, 69, 20, 0.35);
    }
    .match-thumb-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    .match-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .match-live-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #dc2626;
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .match-play-icon {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #fff;
    }
    .match-banner-info {
      padding: 11px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .match-banner-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #fff;
    }
    .match-banner-sub {
      font-size: 11px;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
    }

    /* 2-Column Channel Cards Grid */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
      margin-bottom: 24px;
    }

    .channel-item-card {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 11px;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 76px;
    }
    .channel-item-card:hover {
      background-color: var(--bg-card-hover);
    }
    .channel-item-card.active-card {
      border-color: var(--accent);
      background-color: rgba(255, 69, 20, 0.08);
    }

    .channel-logo-box {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background-color: #09090b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      flex-shrink: 0;
    }
    .channel-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .channel-text-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      flex: 1;
    }
    .channel-name {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
      margin-bottom: 4px;
    }
    .channel-cat {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Social Row */
    .social-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }
    .soc-pill {
      flex: 1;
      min-width: 110px;
      padding: 10px 12px;
      border-radius: 10px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: #16161d;
      border: 1px solid var(--border-subtle);
    }

    /* Slide-Out Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 200;
      display: none;
      justify-content: flex-end;
    }
    .drawer-backdrop.open { display: flex; }
    .drawer-panel {
      width: 300px;
      max-width: 85vw;
      background: #0e0e13;
      border-left: 1px solid var(--border-subtle);
      height: 100%;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .drawer-search {
      width: 100%;
      background: #181820;
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 10px 13px;
      border-radius: 9px;
      font-size: 13px;
      outline: none;
    }
    .drawer-cat-btn {
      width: 100%;
      background: #15151c;
      border: 1px solid transparent;
      color: #d4d4d8;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .drawer-cat-btn.active {
      border-color: var(--accent);
      color: #fff;
      background: rgba(255, 69, 20, 0.15);
    }

    #toast-box {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100001;
    }
    .toast-msg {
      background: #18181f;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 9px 16px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
      margin-top: 6px;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- Header -->
  <header class="app-header">
    <a class="brand-logo" onclick="filterCategory('All')">
      <span id="site-title-white" class="part-white">JK</span><span id="site-title-orange" class="part-orange">LIVETV</span><span class="brand-dot"></span>
    </a>
    <div class="header-actions">
      <button class="menu-btn" onclick="toggleDrawer(true)">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <!-- Live Broadcast Alert Banner from Admin -->
  <div id="top-alert-bar" class="top-alert-bar">
    <i class="fa-solid fa-bullhorn" style="color:var(--accent);"></i>
    <span id="top-alert-text"></span>
  </div>

  <!-- Main Content -->
  <main class="main-wrap">

    <!-- Top Channel Navigation Bar: [<- Back] [• LIVE] Title -->
    <div class="channel-top-bar">
      <button class="btn-back" onclick="document.getElementById('channels-section').scrollIntoView({behavior:'smooth'})">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>
      <div class="badge-live-top">
        <span class="dot"></span>
        <span id="live-pill-text">LIVE</span>
      </div>
      <h1 id="current-channel-title" class="active-channel-heading">INDIA vs NEW ZEALAND — LIVE HD</h1>
    </div>

    <!-- IN-APP UNIVERSAL PLAYER BOX (Plays M3U8, MP4, PHP & Web Links right inside the app!) -->
    <div id="player-box" class="player-box">
      <!-- Clean Live Badge (No Raw Link Shown Anywhere) -->
      <div class="in-player-live-tag">
        <span style="width:6px;height:6px;background:#fff;border-radius:50%;"></span> LIVE HD
      </div>

      <!-- Floating Controls when in Fullscreen / Rotate Mode -->
      <div class="fs-floating-controls">
        <button class="fs-ctrl-pill" onclick="cycleZoomFit()">
          <i class="fa-solid fa-up-right-and-down-left-from-center"></i> Fit
        </button>
        <button class="fs-ctrl-pill" onclick="toggleForcedRotate()">
          <i class="fa-solid fa-rotate"></i> Rotate
        </button>
        <button class="fs-ctrl-pill" style="background:var(--accent);" onclick="exitAllFullscreen()">
          <i class="fa-solid fa-compress"></i> Exit Full
        </button>
      </div>

      <!-- Unmute Floating Pill -->
      <button id="unmute-pill" class="unmute-pill" onclick="unmuteLiveVideo()">
        <i class="fa-solid fa-volume-high"></i> Tap for Sound
      </button>

      <!-- Engine 1: HTML5 HLS Video (No crossorigin attribute so ALL M3U8 links play without CORS block!) -->
      <video id="hls-video" controls autoplay playsinline webkit-playsinline></video>

      <!-- Engine 2: In-App Sandboxed / Embed Player for M3U8 Fallback & play.php links -->
      <iframe id="embed-iframe" referrerpolicy="no-referrer" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>

      <!-- Loading Spinner -->
      <div id="player-loader" class="player-loader">
        <div class="loader-ring"></div>
        <p id="loader-msg" style="font-size:13px; font-weight:700;">Loading Live Match...</p>
      </div>
    </div>

    <!-- Server 1 | Server 2 | Server 3  +  Rotate & Fullscreen Row -->
    <div class="player-action-row">
      <div class="server-buttons-wrap">
        <button id="srv-btn-1" class="btn-server active" onclick="switchServer(1)">Server 1</button>
        <button id="srv-btn-2" class="btn-server" onclick="switchServer(2)">Server 2</button>
        <button id="srv-btn-3" class="btn-server" onclick="switchServer(3)" style="display:none;">Server 3</button>
      </div>

      <div class="right-player-controls">
        <button class="btn-server" onclick="cycleZoomFit()" title="Zoom / Stretch Video">
          <i class="fa-solid fa-up-right-and-down-left-from-center"></i> <span id="fit-label">Fit</span>
        </button>
        <button class="btn-fullscreen-orange" onclick="toggleForcedRotate()" title="Rotate 90° Landscape Full Screen">
          <i class="fa-solid fa-rotate"></i> Rotate Full
        </button>
        <button class="btn-fullscreen-orange" onclick="enterFullRouteScreen()">
          <i class="fa-solid fa-expand"></i> Fullscreen
        </button>
      </div>
    </div>

    <!-- FEATURED LIVE MATCHES / THUMBNAIL BANNERS (Tap thumbnail -> Auto Opens Server & Plays Live) -->
    <div id="featured-section" style="display:none;">
      <div class="section-label-row">
        <span class="section-label"><i class="fa-solid fa-fire" style="color:var(--accent);"></i> LIVE MATCHES (TAP THUMBNAIL TO PLAY LIVE)</span>
      </div>
      <div id="featured-banners-grid" class="featured-banners-grid"></div>
    </div>

    <!-- OTHER CHANNELS (2-Column Grid Like Screenshot) -->
    <div id="channels-section" class="section-label-row">
      <span id="grid-heading" class="section-label">OTHER CHANNELS</span>
      <span id="clear-filter-btn" style="font-size:12px; color:var(--accent); font-weight:700; cursor:pointer; display:none;" onclick="filterCategory('All')">Show All ×</span>
    </div>

    <div id="channels-grid" class="channels-grid"></div>

    <!-- Social Links -->
    <div id="social-row" class="social-row"></div>

  </main>

    const STORAGE_KEY_STREAMS = 'jklive_v5_streams';

    /********************************************************************
     * INITIALIZE & REAL-TIME SYNC
     ********************************************************************/
    window.addEventListener('DOMContentLoaded', () => {
      loadFromLocalStorage();
      connectFirebaseRealtimeDB();

      if ('BroadcastChannel' in window) {
        const bc = new BroadcastChannel('jklive_v5_sync');
        bc.onmessage = () => {
          loadFromLocalStorage();
          if (activeChannel && streamsData[activeChannel.id]) {
            activeChannel = streamsData[activeChannel.id];
            switchServer(activeServerNum);
          }
          showToast("Live Match Updated!");
        };

      window.addEventListener('storage', () => {
        loadFromLocalStorage();
      });

    function connectFirebaseRealtimeDB() {
      try {
        const rtdb = firebase.database();

        rtdb.ref('streams_v5').on('value', snap => {
          const val = snap.val();
          if (val && Object.keys(val).length > 0) {
            streamsData = val;
            localStorage.setItem(STORAGE_KEY_STREAMS, JSON.stringify(streamsData));
            renderAllUI();
          }
        });

        rtdb.ref('settings_v5').on('value', snap => {
          if (snap.val()) {
            localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(snap.val()));
            applySettingsUI(snap.val());
          }
        });

        rtdb.ref('socials_v5').on('value', snap => {
          if (snap.val()) {
            socialsData = snap.val();
            localStorage.setItem(STORAGE_KEY_SOCIALS, JSON.stringify(socialsData));
            renderSocialButtons();
          }
        });
      } catch (e) {}
    }

    function loadFromLocalStorage() {
      const rawStreams = localStorage.getItem(STORAGE_KEY_STREAMS);
      if (!rawStreams) {
        localStorage.setItem(STORAGE_KEY_STREAMS, JSON.stringify(DEFAULT_STREAMS_DATA));
        streamsData = DEFAULT_STREAMS_DATA;
      } else {
        try { streamsData = JSON.parse(rawStreams); } catch (e) { streamsData = DEFAULT_STREAMS_DATA; }
      }

      const rawSettings = localStorage.getItem(STORAGE_KEY_SETTINGS);
      if (rawSettings) {
        try { applySettingsUI(JSON.parse(rawSettings)); } catch (e) {}
      }

      const rawSocials = localStorage.getItem(STORAGE_KEY_SOCIALS);
      if (rawSocials) {
        try { socialsData = JSON.parse(rawSocials); } catch (e) {}
      } else {
        socialsData = {
          telegram: { name: "Telegram", url: "https://t.me/" },
          whatsapp: { name: "WhatsApp", url: "https://whatsapp.com/" }
        };
      }

      renderAllUI();
      renderSocialButtons();
    }

    function applySettingsUI(cfg) {
      if (!cfg) return;
      if (cfg.siteWhite) document.getElementById('site-title-white').textContent = cfg.siteWhite;
      if (cfg.siteOrange) document.getElementById('site-title-orange').textContent = cfg.siteOrange;
      if (cfg.themeColor) document.documentElement.style.setProperty('--accent', cfg.themeColor);

      const alertBar = document.getElementById('top-alert-bar');
      if (cfg.alertText && cfg.alertText.trim() !== '') {
        document.getElementById('top-alert-text').textContent = cfg.alertText;
        alertBar.classList.add('show');
      } else {
        alertBar.classList.remove('show');
      }

    /********************************************************************
     * 4-STAGE IN-APP STREAM ENGINE (Plays ANY M3U8, MP4, or PHP/Embed URL)
     * 100% Inside the App — Never shows raw URL
     ********************************************************************/
    function selectAndPlayChannel(channelId) {
      const ch = streamsData[channelId];
      if (!ch) return;

      activeChannel = ch;
      activeServerNum = 1;

      document.getElementById('current-channel-title').textContent = ch.title;
      document.getElementById('srv-btn-3').style.display = ch.server3 ? 'inline-flex' : 'none';

      renderAllUI();
      switchServer(1);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchServer(srvNum) {
      if (!activeChannel) return;
      activeServerNum = srvNum;

      [1, 2, 3].forEach(n => {
        const b = document.getElementById('srv-btn-' + n);
        if (b) b.classList.toggle('active', n === srvNum);
      });

      let streamUrl = activeChannel.server1;
      if (srvNum === 2 && activeChannel.server2) streamUrl = activeChannel.server2;
      if (srvNum === 3 && activeChannel.server3) streamUrl = activeChannel.server3;

      playInAppStream(streamUrl, activeChannel.streamType || 'auto');
    }

    function detectIsM3U8(url, forcedType) {
      if (forcedType === 'm3u8') return true;
      if (forcedType === 'embed') return false;
      if (!url) return false;
      const u = url.toLowerCase();
      if (u.includes('.m3u8') || u.includes('/hls/') || u.includes('m3u8')) return true;
      return false;
    }

    function playInAppStream(rawUrl, forcedType) {
      const loader = document.getElementById('player-loader');
      loader.classList.add('active');
      unmuteBtn.classList.remove('show');

      // Clean up previous instances
      if (hlsPlayer) {
        hlsPlayer.destroy();
        hlsPlayer = null;
      }
      if (activeBlobUrl) {
        URL.revokeObjectURL(activeBlobUrl);
        activeBlobUrl = null;
      }
      videoEl.pause();
      videoEl.removeAttribute('src');
      iframeEl.src = 'about:blank';

      if (!rawUrl || !rawUrl.trim().startsWith('http')) {
        loader.classList.remove('active');
        showToast("Server link not set");
        return;
      }

      const url = rawUrl.trim();
      const isM3u8 = detectIsM3U8(url, forcedType);

      if (isM3u8) {
        // STAGE 1: Direct HLS.js Without CORS Restriction
        iframeEl.classList.remove('active-engine');
        videoEl.classList.add('active-engine');

        if (Hls.isSupported()) {
          hlsPlayer = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            xhrSetup: function(xhr) {
              xhr.withCredentials = false;
            }
          });

          hlsPlayer.loadSource(url);
          hlsPlayer.attachMedia(videoEl);

          hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
            loader.classList.remove('active');
            tryPlayVideoElement();
          });

          hlsPlayer.on(Hls.Events.ERROR, (e, data) => {
            if (data.fatal) {
              if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                hlsPlayer.recoverMediaError();
              } else {
                // STAGE 2 FALLBACK: Try Native Video or Sandboxed In-App Blob Player
                playM3U8InsideBlobSandbox(url);
              }
            }
          });
        } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
          videoEl.src = url;
          videoEl.onloadedmetadata = () => {
            loader.classList.remove('active');
            tryPlayVideoElement();
          };
          videoEl.onerror = () => playM3U8InsideBlobSandbox(url);
        } else {
          playM3U8InsideBlobSandbox(url);
        }
      } else {
        // STAGE 3: In-App No-Referrer Embed Player (For play.php / web links)
        videoEl.classList.remove('active-engine');
        iframeEl.classList.add('active-engine');
        iframeEl.src = url;

        iframeEl.onload = () => {
          loader.classList.remove('active');
        };
        setTimeout(() => loader.classList.remove('active'), 1400);
      }
    }

    // Isolated In-App Blob Player for tricky M3U8 links with strict referrer rules
    function playM3U8InsideBlobSandbox(m3u8Url) {
      const loader = document.getElementById('player-loader');
      videoEl.classList.remove('active-engine');
      iframeEl.classList.add('active-engine');

      const htmlContent = `<!DOCTYPE html>
      <html>
      <head>
        <meta charset="utf-8">
        <meta name="referrer" content="no-referrer">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <style>
          body,html{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;}
          video{width:100%;height:100%;object-fit:contain;}
        </style>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"><\/script>
      </head>
      <body>
        <video id="v" controls autoplay playsinline></video>
        <script>
          const v = document.getElementById('v');
          const src = ${JSON.stringify(m3u8Url)};
          if (Hls.isSupported()) {
            const h = new Hls({ enableWorker: true });
            h.loadSource(src);
            h.attachMedia(v);
            h.on(Hls.Events.MANIFEST_PARSED, () => {
              v.play().catch(() => { v.muted = true; v.play(); });
            });
          } else {
            v.src = src;
            v.play().catch(() => { v.muted = true; v.play(); });
          }
        <\/script>
      </body>
      </html>`;

      const blob = new Blob([htmlContent], { type: 'text/html' });
      activeBlobUrl = URL.createObjectURL(blob);
      iframeEl.src = activeBlobUrl;
      setTimeout(() => loader.classList.remove('active'), 1000);
    }

    function tryPlayVideoElement() {
      videoEl.muted = false;
      videoEl.play().then(() => {
        unmuteBtn.classList.remove('show');
      }).catch(() => {
        videoEl.muted = true;
        videoEl.play().catch(() => {});
        unmuteBtn.classList.add('show');
      });
    }

    function unmuteLiveVideo() {
      videoEl.muted = false;
      videoEl.volume = 1.0;
      unmuteBtn.classList.remove('show');
    }

    /********************************************************************
     * FULL ROTATE / FULL ROUTE LANDSCAPE FULLSCREEN ENGINE
     ********************************************************************/
    async function enterFullRouteScreen() {
      try {
        if (playerBox.requestFullscreen) {
          await playerBox.requestFullscreen();
        } else if (playerBox.webkitRequestFullscreen) {
          playerBox.webkitRequestFullscreen();
        } else {
          playerBox.classList.add('in-app-fullscreen');
        }
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      } catch (e) {
        playerBox.classList.toggle('in-app-fullscreen');
      }
    }

    function toggleForcedRotate() {
      // Forces 90-degree full landscape screen on ANY mobile browser even if auto-rotate is off!
      if (playerBox.classList.contains('forced-landscape-rotate')) {
        exitAllFullscreen();
      } else {
        playerBox.classList.remove('in-app-fullscreen');
        playerBox.classList.add('forced-landscape-rotate');
        showToast("Rotated to Full Landscape View");
      }
    }

    function exitAllFullscreen() {
      playerBox.classList.remove('in-app-fullscreen');
      playerBox.classList.remove('forced-landscape-rotate');
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    }

    function cycleZoomFit() {
      zoomModes.forEach(m => { if (m.cls) playerBox.classList.remove(m.cls); });
      zoomIdx = (zoomIdx + 1) % zoomModes.length;
      if (zoomModes[zoomIdx].cls) playerBox.classList.add(zoomModes[zoomIdx].cls);
      document.getElementById('fit-label').textContent = zoomModes[zoomIdx].name;
      showToast("Screen Mode: " + zoomModes[zoomIdx].name);
    }

    /********************************************************************
     * RENDER FEATURED MATCH THUMBNAILS & 2-COLUMN CHANNEL GRID
     ********************************************************************/
    function renderAllUI() {
      const allList = Object.values(streamsData)
        .filter(item => item.published !== false)
        .sort((a, b) => (a.order || 99) - (b.order || 99));

      if (!activeChannel && allList.length > 0) {
        activeChannel = allList[0];
        document.getElementById('current-channel-title').textContent = activeChannel.title;
        document.getElementById('srv-btn-3').style.display = activeChannel.server3 ? 'inline-flex' : 'none';
        playInAppStream(activeChannel.server1, activeChannel.streamType || 'auto');
      } else if (activeChannel && streamsData[activeChannel.id]) {
        activeChannel = streamsData[activeChannel.id];
        document.getElementById('current-channel-title').textContent = activeChannel.title;
      }

      // 1. Featured Match Banners (16:9 Thumbnails like IND vs NZ)
      const banners = allList.filter(item => item.isBanner === true || item.category === 'LIVE MATCH');
      const featuredSec = document.getElementById('featured-section');
      const bannerGrid = document.getElementById('featured-banners-grid');

      if (banners.length > 0 && (currentCategory === 'All' || currentCategory === 'LIVE MATCH')) {
        featuredSec.style.display = 'block';
        bannerGrid.innerHTML = banners.map(b => {
          const isCurrent = activeChannel && activeChannel.id === b.id;
          return `
            <div class="match-banner-card ${isCurrent ? 'active-card' : ''}" onclick="selectAndPlayChannel('${b.id}')">
              <div class="match-thumb-wrap">
                <img src="${b.thumbnail}" alt="${escHtml(b.title)}" onerror="this.src='https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=800&q=80'" />
                <span class="match-live-tag"><span class="dot" style="width:6px;height:6px;background:#fff;border-radius:50%;"></span> LIVE NOW</span>
                <div class="match-play-icon"><i class="fa-solid fa-circle-play"></i></div>
              </div>
              <div class="match-banner-info">
                <div>
                  <div class="match-banner-title">${escHtml(b.title)}</div>
                  <div class="match-banner-sub">Tap Thumbnail to Play Live Inside App</div>
                </div>
                <i class="fa-solid fa-bolt" style="color:var(--accent); font-size:18px;"></i>
              </div>
            </div>
          `;
        }).join('');
      } else {
        featuredSec.style.display = 'none';
      }

      // 2. Standard 2-Column Channels Grid
      const filteredChannels = allList.filter(c => {
        const catMatch = currentCategory === 'All' || (c.category && c.category.toUpperCase() === currentCategory.toUpperCase());
        const searchMatch = !searchQuery || c.title.toLowerCase().includes(searchQuery) || (c.category && c.category.toLowerCase().includes(searchQuery));
        return catMatch && searchMatch;
      });

      const grid = document.getElementById('channels-grid');
      grid.innerHTML = filteredChannels.map(ch => {
        const isCurrent = activeChannel && activeChannel.id === ch.id;
        return `
          <div class="channel-item-card ${isCurrent ? 'active-card' : ''}" onclick="selectAndPlayChannel('${ch.id}')">
            <div class="channel-logo-box">
              <img src="${ch.thumbnail}" alt="${escHtml(ch.title)}" onerror="this.src='https://ui-avatars.com/api/?name=TV&background=27272a&color=fff&bold=true'" />
            </div>
            <div class="channel-text-box">
              <div class="channel-name">${escHtml(ch.title)}</div>
              <div class="channel-cat">${escHtml(ch.category || 'SPORTS')}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderSocialButtons() {
      const row = document.getElementById('social-row');
      const list = Object.values(socialsData || {});
      row.innerHTML = list.map(s => `
        <a href="${s.url}" target="_blank" rel="noopener" class="soc-pill">
          <i class="fa-solid fa-share-nodes" style="color:var(--accent);"></i>
          <span>Join ${escHtml(s.name)}</span>
        </a>
      `).join('');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.getElementById('grid-heading').textContent = cat === 'All' ? 'OTHER CHANNELS' : `${cat}`;
      document.getElementById('clear-filter-btn').style.display = cat === 'All' ? 'none' : 'inline';
      renderAllUI();
      toggleDrawer(false);
    }

    function onSearchInput(val) {
      searchQuery = val.trim().toLowerCase();
      renderAllUI();
    }

    function toggleDrawer(open) {
      document.getElementById('menu-drawer').classList.toggle('open', open);
    }

    function showToast(msg) {
      const box = document.getElementById('toast-box');
      const d = document.createElement('div');
      d.className = 'toast-msg';
      d.textContent = msg;
      box.appendChild(d);
      setTimeout(() => d.remove(), 2500);
    }

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }
  </script>
